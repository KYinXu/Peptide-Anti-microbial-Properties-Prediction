[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peptide-amp-prediction"
version = "0.1.0"
description = "Peptide antimicrobial property prediction (SVM, GNN, ESMFold)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.21.0",
  "pandas>=1.3.0",
  "scipy>=1.7.0",
  "scikit-learn>=1.0.0",
  "torch>=2.0.0",
  "torch-geometric>=2.3.0",
  "biopython>=1.79",
  "tqdm>=4.62.0",
  "joblib>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
